name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Flutter project
        run: |
          rm -rf android ios
          flutter create . --project-name yuewu --org com.yuewu --platforms android

      - name: Configure Android
        run: |
          python3 -c "
          import re
          with open('android/app/src/main/AndroidManifest.xml','r') as f: m=f.read()
          m = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"月悟\"', m)
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1)
          with open('android/app/src/main/AndroidManifest.xml','w') as f: f.write(m)
          print(open('android/app/src/main/AndroidManifest.xml').read())
          "
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: 月悟 v1.0.1
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
