name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Flutter project
        run: |
          rm -rf android ios
          flutter create . --project-name yuewu --org com.yuewu --platforms android

      - name: Configure Android
        run: |
          python3 -c "
          import re
          with open('android/app/src/main/AndroidManifest.xml','r') as f: m=f.read()
          m = re.sub(r'android:label=\"[^\"]*\"', 'android:label=\"月悟\"', m)
          if 'usesCleartextTraffic' not in m:
              m = m.replace('<application', '<application android:usesCleartextTraffic=\"true\"', 1)
          if 'INTERNET' not in m:
              m = m.replace('<manifest', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <uses-permission android:name=\"android.permission.INTERNET\"/>', 1)
          with open('android/app/src/main/AndroidManifest.xml','w') as f: f.write(m)
          print(open('android/app/src/main/AndroidManifest.xml').read())
          "
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties

      - name: Configure Signing
        run: |
          set -x
          cp yuewu.keystore android/app/yuewu.keystore
          ls -la android/app/yuewu.keystore
          cat > /tmp/sign.py << 'PYEOF'
          import os
          base = 'android/app'
          block = ('signingConfigs {\n'
                   '    create("release") {\n'
                   '        storeFile = file("yuewu.keystore")\n'
                   '        storePassword = "yuewu2024"\n'
                   '        keyAlias = "yuewu"\n'
                   '        keyPassword = "yuewu2024"\n'
                   '    }\n'
                   '}\n')
          for fn in ['build.gradle', 'build.gradle.kts']:
              p = os.path.join(base, fn)
              if not os.path.exists(p):
                  continue
              g = open(p).read()
              if 'create("release")' not in g:
                  g = g.replace('buildTypes {', block + 'buildTypes {', 1)
              g = g.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              g = g.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.getByName("release")')
              g = g.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              open(p, 'w').write(g)
              print('=== patched', p, '===')
              print(open(p).read())
          PYEOF
          python3 /tmp/sign.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: 月悟 v1.2.0（私人服务器）
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
