name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Flutter project
        run: |
          rm -rf android ios
          flutter create . --project-name yuewu --org com.yuewu --platforms android

      - name: Configure Android
        run: |
          sed -i 's/android:label=".*"/android:label="月悟"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK as Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 月悟 v1.0.0
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
