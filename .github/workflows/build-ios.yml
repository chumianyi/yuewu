name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      - name: Create iOS platform files
        run: flutter create --platforms=ios --org com.chumian --project-name yuewu .

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Zip .app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../yuewu-ios.app.zip Runner.app
          cd ../..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yuewu-ios
          path: yuewu-ios.app.zip
          retention-days: 7
